services:
  cms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms_sekitarin_app
    depends_on:
      cms-db:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped
    environment:
      CI_BASE_URL: ${CI_BASE_URL:-http://localhost:8088/}
      CMS_DB_HOST: ${CMS_DB_HOST:-cms-db}
      CMS_DB_PORT: ${CMS_DB_PORT:-3306}
      CMS_DB_NAME: ${CMS_DB_NAME:-cmsdb_sekitarin}
      CMS_DB_USER: ${CMS_DB_USER:-cmsuser_sekitarin}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD:?Set CMS_DB_PASSWORD in .env}
      SEKITAR_WS_PUBLISH_URL: ${SEKITAR_WS_PUBLISH_URL:-http://sekitar-ws:8090/publish}
      SEKITAR_WS_SECRET: ${SEKITAR_WS_SECRET:?Set SEKITAR_WS_SECRET in .env}
      SEKITAR_JITSI_URL: ${SEKITAR_JITSI_URL:-https://jitsi.ckamal.com}
      SEKITAR_JITSI_APP_ID: ${SEKITAR_JITSI_APP_ID:-}
      SEKITAR_JITSI_SECRET: ${SEKITAR_JITSI_SECRET:-}
      SEKITAR_JITSI_DOMAIN: ${SEKITAR_JITSI_DOMAIN:-meet.jitsi}
      SEKITAR_JITSI_AUDIENCE: ${SEKITAR_JITSI_AUDIENCE:-jitsi}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-1}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-30}
      TZ: UTC
    volumes:
      - ./web:/var/www/html
      - ./database_backup:/backup
      - app_cache:/var/www/html/application/cache
      - app_logs:/var/www/html/application/logs

  sekitar-push:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms_sekitarin_push
    depends_on:
      cms-db:
        condition: service_healthy
    entrypoint: ["php", "/tools/push_worker.php"]
    restart: unless-stopped
    environment:
      DB_HOST: ${CMS_DB_HOST:-cms-db}
      DB_PORT: ${CMS_DB_PORT:-3306}
      DB_NAME: ${CMS_DB_NAME:-cmsdb_sekitarin}
      DB_USER: ${CMS_DB_USER:-cmsuser_sekitarin}
      DB_PASSWORD: ${CMS_DB_PASSWORD:?Set CMS_DB_PASSWORD in .env}
      SEKITAR_FCM_SERVICE_ACCOUNT: /run/secrets/fcm-service-account.json
      SEKITAR_WS_PUBLISH_URL: ${SEKITAR_WS_PUBLISH_URL:-http://sekitar-ws:8090/publish}
      SEKITAR_WS_SECRET: ${SEKITAR_WS_SECRET:?Set SEKITAR_WS_SECRET in .env}
      PUSH_POLL_SECONDS: 5
    volumes:
      - ./tools:/tools:ro
      - ./secrets:/run/secrets:ro

  sekitar-ws:
    build:
      context: ./ws
    container_name: cms_sekitarin_ws
    depends_on:
      cms-db:
        condition: service_healthy
    ports:
      - "8090:8090"
    restart: unless-stopped
    environment:
      PORT: 8090
      DB_HOST: ${CMS_DB_HOST:-cms-db}
      DB_PORT: ${CMS_DB_PORT:-3306}
      DB_NAME: ${CMS_DB_NAME:-cmsdb_sekitarin}
      DB_USER: ${CMS_DB_USER:-cmsuser_sekitarin}
      DB_PASSWORD: ${CMS_DB_PASSWORD:?Set CMS_DB_PASSWORD in .env}
      WS_SECRET: ${SEKITAR_WS_SECRET:?Set SEKITAR_WS_SECRET in .env}
      TZ: UTC

  cms-db:
    image: mysql:8.0
    container_name: cms_sekitarin_db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CMS_DB_ROOT_PASSWORD:?Set CMS_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${CMS_DB_NAME:-cmsdb_sekitarin}
      MYSQL_USER: ${CMS_DB_USER:-cmsuser_sekitarin}
      MYSQL_PASSWORD: ${CMS_DB_PASSWORD:?Set CMS_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  app_cache:
  app_logs:
  db_data:
